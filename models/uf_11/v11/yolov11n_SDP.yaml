# YOLOv11n-HSFPN
# 结合 HS-FPN 论文改进微小物体检测

nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4 (P3 特征，作为 Lateral 输入)
  - [-1, 1, Conv, [512, 3, 2]]           # 5-P4/16
  - [-1, 2, C3k2, [512, True]]           # 6 (P4 特征，作为 Lateral 输入)
  - [-1, 1, Conv, [1024, 3, 2]]          # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5]]             # 9
  - [-1, 2, C2PSA, [1024]]               # 10 (P5 特征，作为 Top 输入)

head:
  # === HS-FPN 自顶向下路径 (Top-Down) ===
  # 融合 P5 (上层) 和 P4 (横向)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (上采样 P5)
  # HS-FPN 融合。输入: [层11(上采样后), 层6(Lateral P4)]
  # 输出通道数将保持为 P4 的通道数 (512)
  - [[-1, 6], 1, HSFPN_Fusion, [512, 1024]]    # 12
  - [-1, 2, C3k2, [512, False]]                # 13 (处理融合后的 P4)

  # 融合 P4 (上层) 和 P3 (横向)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (上采样 P4)
  # HS-FPN 融合。输入: [层14(上采样后), 层4(Lateral P3)]
  # 输出通道数将保持为 P3 的通道数 (256)
  - [[-1, 4], 1, HSFPN_Fusion, [256, 512]]     # 15
  - [-1, 2, C3k2, [256, False]]                # 16 (处理融合后的 P3)

  # === 标准自底向上路径 (Bottom-Up PANet) ===
  # 底部向上路径保持原样，以维持检测头的多尺度能力
  - [-1, 1, Conv, [256, 3, 2]]                 # 17
  - [[-1, 13], 1, Concat, [1]]                 # 18 (与 P4 拼接)
  - [-1, 2, C3k2, [512, False]]                # 19

  - [-1, 1, Conv, [512, 3, 2]]                 # 20
  - [[-1, 10], 1, Concat, [1]]                 # 21 (与 P5 拼接)
  - [-1, 2, C3k2, [1024, True]]                # 22

  - [[16, 19, 22], 1, Detect, [nc]]            # 23