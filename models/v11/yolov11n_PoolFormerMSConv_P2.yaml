# YOLO11-Small-Target with PoolFormerMSConvBlock
nc: 80
scales:
  n: [0.50, 0.25, 1024] # 保持 n 缩放

# YOLO11 Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1-P2/4
  - [-1, 2, PoolFormerMSConvBlock, [3, 4.0, 0.0]]  # 2 - 特征提取 (P2)
  - [-1, 1, Conv, [256, 3, 2]]             # 3-P3/8
  - [-1, 3, PoolFormerMSConvBlock, [3, 4.0, 0.0]]  # 4 - 特征提取 (P3)
  - [-1, 1, Conv, [512, 3, 2]]             # 5-P4/16
  - [-1, 3, PoolFormerMSConvBlock, [3, 4.0, 0.0]]  # 6 - 特征提取 (P4)
  - [-1, 1, Conv, [1024, 3, 2]]            # 7-P5/32
  - [-1, 2, PoolFormerMSConvBlock, [3, 4.0, 0.0]]  # 8 - 特征提取 (P5)
  - [-1, 1, SPPF, [1024, 5]]               # 9
  - [-1, 2, C2PSA, [1024]]                 # 10

# YOLO11 Head (4-branch for Small Objects)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13 (P4-upsampled)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3-upsampled)

  # --- 新增 P2 分支，强化小目标检测 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2-Head, 步长 4)

  # --- 下采样回归 ---
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2, [256, False]] # 22 (P3-Head)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 25 (P4-Head)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 28 (P5-Head)

  # Detect 层增加 P2 (第19层) 的输出
  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)