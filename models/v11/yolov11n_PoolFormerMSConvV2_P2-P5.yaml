# Ultralytics YOLO11 object detection model with P2/4 - P4/16 outputs
# Optimized for small objects, removing the P5 head to reduce complexity.

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1-P2/4
  - [-1, 2, PoolFormerMSConvBlockV2, [3, 4.0, 0.0]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]]             # 3-P3/8
  - [-1, 6, PoolFormerMSConvBlockV2, [3, 4.0, 0.0]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]]             # 5-P4/16
  - [-1, 3, PoolFormerMSConvBlockV2, [3, 3.0, 0.0]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]            # 7-P5/32
  - [-1, 2, PoolFormerMSConvBlockV2, [3, 2.0, 0.0]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]]               # 9
  - [-1, 2, C2PSA, [1024]]                 # 10


# YOLO11n head
head:
  # --- PANet Upsampling Path ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (P5 -> P4)
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13 (P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (P4 -> P3)
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17 (P3 -> P2)
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2 - Tiny objects)

  # --- PANet Downsampling Path ---
  - [-1, 1, Conv, [128, 3, 2]]  # 20 (P2 -> P3)
  - [[-1, 16], 1, Concat, [1]]  # 21 cat head P3
  - [-1, 2, C3k2, [256, False]] # 22 (P3 - Small objects)

  - [-1, 1, Conv, [256, 3, 2]]  # 23 (P3 -> P4)
  - [[-1, 13], 1, Concat, [1]]  # 24 cat head P4
  - [-1, 2, C3k2, [512, False]] # 25 (P4 - Medium objects)

  # Detect Head (P2, P3, P4)
  - [[19, 22, 25], 1, Detect, [nc]] # Detect(P2, P3, P4)