# YOLO11-Target-Optimized (Small & Medium Focus)
nc: 80
scales:
  n: [0.50, 0.25, 1024]

# YOLO11 Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1-P2/4

  # Stage 2 (P2): 增强底层特征提取
  - [-1, 3, PoolFormerMSConvBlockV3, [3, 4.0]] # 2-P2/4

  - [-1, 1, Conv, [256, 3, 2]]             # 3-P3/8

  # Stage 3 (P3): 小目标核心层，深度由 6 增加到 9，保持高 ratio
  - [-1, 9, PoolFormerMSConvBlockV3, [3, 4.0]] # 4-P3/8

  - [-1, 1, Conv, [512, 3, 2]]             # 5-P4/16

  # Stage 4 (P4): 中等目标辅助层，深度 4，下调 ratio 至 3.0
  - [-1, 4, PoolFormerMSConvBlockV3, [3, 3.0]] # 6-P4/16

  - [-1, 1, Conv, [1024, 3, 2]]            # 7-P5/32

  # Stage 5 (P5): 大目标弱化，深度 1，下调 ratio 至 2.0
  - [-1, 1, PoolFormerMSConvBlockV3, [3, 2.0]] # 8-P5/32

  - [-1, 1, SPPF, [1024, 5]]               # 9
  - [-1, 2, C2PSA, [1024]]                 # 10

# YOLO11 Head (Standard 3-branch: P3, P4, P5)
head:
  # --- Top-down path ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (P4 scale)
  - [[-1, 6], 1, Concat, [1]]                  # 12 (cat backbone P4)
  - [-1, 2, C3k2, [512, False]]                # 13 (P4-FPN)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (P3 scale)
  - [[-1, 4], 1, Concat, [1]]                  # 15 (cat backbone P3)
  - [-1, 2, C3k2, [256, False]]                # 16 (P3-Head output)

  # --- Bottom-up path ---
  - [-1, 1, Conv, [256, 3, 2]]                 # 17 (Down to P4)
  - [[-1, 13], 1, Concat, [1]]                 # 18 (cat P4-FPN)
  - [-1, 2, C3k2, [512, False]]                # 19 (P4-Head output)

  - [-1, 1, Conv, [512, 3, 2]]                 # 20 (Down to P5)
  - [[-1, 10], 1, Concat, [1]]                 # 21 (cat backbone P5)
  - [-1, 2, C3k2, [1024, True]]                # 22 (P5-Head output)

  # 最终检测层
  - [[16, 19, 22], 1, Detect, [nc]]            # 23