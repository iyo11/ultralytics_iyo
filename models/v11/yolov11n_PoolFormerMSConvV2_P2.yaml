# YOLO11-Small-Target-Optimized
nc: 80
scales:
  n: [0.50, 0.25, 1024]

# YOLO11 Backbone
backbone:
  # [from, repeats, module, args]
  # args: [pool_size, mlp_ratio, drop_path]
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1-P2/4

  # Layer 2: P2 - 极小目标 (High Resolution)
  # 保持 mlp_ratio=4.0 以丰富底层细节
  - [-1, 2, PoolFormerMSConvBlockV2, [3, 4.0, 0.0]]

  - [-1, 1, Conv, [256, 3, 2]]             # 3-P3/8

  # Layer 4: P3 - 中/小目标核心层 (关键修改!)
  # 增加 repeat 到 6，确保在这个尺度提取充分
  - [-1, 6, PoolFormerMSConvBlockV2, [3, 4.0, 0.0]]

  - [-1, 1, Conv, [512, 3, 2]]             # 5-P4/16

  # Layer 6: P4 - 中/大目标
  # 适当降低 mlp_ratio 到 3.0 或保持 4.0，视显存而定
  - [-1, 3, PoolFormerMSConvBlockV2, [3, 3.0, 0.0]]

  - [-1, 1, Conv, [1024, 3, 2]]            # 7-P5/32

  # Layer 8: P5 - 大目标/全局语义
  # mlp_ratio 降为 2.0，节省参数，因为小目标不依赖此层
  - [-1, 2, PoolFormerMSConvBlockV2, [3, 2.0, 0.0]]

  - [-1, 1, SPPF, [1024, 5]]               # 9
  - [-1, 2, C2PSA, [1024]]                 # 10

# YOLO11 Head (4-branch, 保持你的小目标设计)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16

  # --- P2 分支 (重要: 极小目标) ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2-Head)

  # --- 下采样 ---
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 22 (P3-Head)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 25 (P4-Head)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 28 (P5-Head)

  - [[19, 22, 25, 28], 1, Detect, [nc]]